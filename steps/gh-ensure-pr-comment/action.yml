name: Ensure PR Comment
description: Creates or updates the PR comment that carries a given tag, so reruns edit one comment instead of stacking new ones.

inputs:
  tag:
    description: Tag that identifies the comment across runs (e.g. preview-url)
    required: true
  message:
    description: Comment body (markdown)
    required: true
  token:
    description: GitHub token with pull-requests write access
    required: true
  pr-number:
    description: Pull request number (defaults to the PR that triggered the run)
    required: false
    default: ${{ github.event.pull_request.number }}
  repository:
    description: |
      Repository (owner/name) the pull request lives in. Defaults to the repository running the
      workflow. To comment on another repository's PR, pass its pr-number too, and a token with
      pull-requests write access there (e.g. a GitHub App installation token).
    required: false
    default: ${{ github.repository }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        MESSAGE: ${{ inputs.message }}
        PR_NUMBER: ${{ inputs.pr-number }}
        REPO: ${{ inputs.repository }}
        # Same marker thollander/actions-comment-pull-request wrote, so comments posted before a
        # consumer switched keep being updated in place.
        MARKER: <!-- thollander/actions-comment-pull-request "${{ inputs.tag }}" -->
      run: |
        set -euo pipefail
        if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
          echo "::error::pr-number must be a number, got '$PR_NUMBER'" >&2
          exit 1
        fi
        if ! [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
          echo "::error::repository must be owner/name, got '$REPO'" >&2
          exit 1
        fi
        BODY_FILE="$(mktemp)"
        trap 'rm -f "$BODY_FILE"' EXIT
        printf '%s\n%s' "$MESSAGE" "$MARKER" > "$BODY_FILE"

        COMMENT_ID="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
          --jq '.[] | select(.body | contains(env.MARKER)) | .id' | head -n 1)"
        if [ -n "$COMMENT_ID" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@"$BODY_FILE" > /dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$BODY_FILE" > /dev/null
        fi
