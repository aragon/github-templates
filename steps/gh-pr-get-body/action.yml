name: GitHub PR Get Body
description: Reads a PR body via gh (heredoc-safe output).

inputs:
  pr-number:
    description: Pull request number
    required: true
  token:
    description: GitHub token (PAT recommended)
    required: true

outputs:
  body:
    description: PR body
    value: ${{ steps.get.outputs.body }}

runs:
  using: composite
  steps:
    - id: get
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        . "$GITHUB_ACTION_PATH/../../lib/gha.sh"
        BODY="$(gh pr view "$PR_NUMBER" --json body -q .body)"
        gha_set_multiline "$GITHUB_OUTPUT" body "$BODY"
