# Pass-through of pnpm/action-setup, as aragon/github-templates/steps/setup-pnpm.
# Generated by `npm run passthrough:sync` — do not edit by hand. Inputs, outputs and defaults
# are copied verbatim from the upstream action.yml at the pinned SHA, so a caller swaps the
# upstream `uses:` for this action and changes nothing else. Dependabot bumps the pin; CI fails
# until the interface is re-copied (README "Pass-through actions").
name: "pnpm/action-setup (pass-through)"
description: "Runs pnpm/action-setup at the version pinned in aragon/github-templates, with the same inputs, outputs and defaults."

inputs:
  version:
    description: Version of pnpm to install
    required: false
  dest:
    description: Where to store pnpm files
    required: false
    default: ~/setup-pnpm
  run_install:
    description: If specified, run `pnpm install`
    required: false
    default: 'null'
  cache:
    description: Whether to cache the pnpm store directory
    required: false
    default: 'false'
  cache_dependency_path:
    description: File path to the pnpm lockfile, whose contents hash will be used as a cache key. Accepts multiple paths delimited by newlines.
    required: false
    default: 'pnpm-lock.yaml'
  package_json_file:
    description: File path to the package.json to read "packageManager" configuration. This path must be relative to the repository root (GITHUB_WORKSPACE).
    required: false
    default: 'package.json'
  standalone:
    description: When set to true for pnpm v11 and earlier, install @pnpm/exe to use pnpm without Node.js. pnpm v12 uses the plain pnpm package's native executable.
    required: false
    default: 'false'

outputs:
  dest:
    description: Expanded path of inputs#dest
    value: ${{ steps.upstream.outputs.dest }}
  bin_dest:
    description: Location of `pnpm` and `pnpx` command
    value: ${{ steps.upstream.outputs.bin_dest }}

runs:
  using: "composite"
  steps:
    - id: upstream
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: ${{ inputs.version }}
        dest: ${{ inputs.dest }}
        run_install: ${{ inputs.run_install }}
        cache: ${{ inputs.cache }}
        cache_dependency_path: ${{ inputs.cache_dependency_path }}
        package_json_file: ${{ inputs.package_json_file }}
        standalone: ${{ inputs.standalone }}
