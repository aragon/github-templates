name: Generate Release Summary
description: Generates a PR/Slack-friendly release summary from the git log range (optionally enriched with Linear issue titles).

inputs:
  linear-api-token:
    description: Linear API token for fetching issue titles (optional)
    required: false
    default: ""
  base-ref:
    description: |
      Override base ref for the summary range (optional, not recommended).
      Auto-detection finds the latest semver tag and computes merge-base, which works for
      both releases and hotfixes. Only set this for debugging or edge cases.
    required: false
    default: ""
  repo:
    description: "owner/repo used to linkify PR numbers (defaults to the current repository)"
    required: false
    default: ${{ github.repository }}

outputs:
  summary:
    description: Generated summary markdown
    value: ${{ steps.summary.outputs.summary }}

runs:
  using: composite
  steps:
    - id: summary
      shell: bash
      env:
        LINEAR_API_TOKEN: ${{ inputs.linear-api-token }}
        BASE_REF: ${{ inputs.base-ref }}
        REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/generateReleaseSummary.js"
