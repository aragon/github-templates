name: "Setup"
description: "Checks out the repository, sets up Node and installs dependencies with pnpm."

inputs:
  repository:
    description: "The repository to checkout"
    required: false
    default: ${{ github.repository }}
  fetch-depth:
    description: "The number of commits to fetch when checking out the repository"
    required: false
    default: "1"
  token:
    description: "GitHub token used for authentication"
    required: false
    default: ${{ github.token }}
  ref:
    description: "The branch, tag or SHA to checkout."
    required: false
  allow-unsafe-pr-checkout:
    description: |
      Pass-through to actions/checkout's `allow-unsafe-pr-checkout`. Only set this to "true" if the
      caller's own workflow is triggered by `pull_request_target` or `workflow_run`, intentionally
      checks out fork PR code via `ref`, and has reviewed the risk at https://gh.io/securely-using-pull_request_target.
      Defaults to "false" (actions/checkout's own default), which is safe for every other trigger.
    required: false
    default: "false"
  registry-url:
    description: |
      URL of the registry used for Node setup. Left EMPTY by default so it does not write an .npmrc
      with a placeholder NODE_AUTH_TOKEN — that would shadow npm OIDC trusted publishing. Set it
      (e.g. https://registry.npmjs.org) only when a token-based registry is actually needed.
    required: false
    default: ""
  node-version:
    description: "The version of Node.js to use (ignored when node-version-file is set)"
    required: false
    default: "24"
  node-version-file:
    description: "Path to a file containing the Node version (e.g. .nvmrc). Takes precedence over node-version."
    required: false
    default: ""
  node-cache:
    description: "Package manager to use for caching"
    required: false
    default: "pnpm"
  install:
    description: "Whether to run pnpm install"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        fetch-depth: ${{ inputs.fetch-depth }}
        token: ${{ inputs.token }}
        ref: ${{ inputs.ref }}
        allow-unsafe-pr-checkout: ${{ inputs.allow-unsafe-pr-checkout }}

    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        run_install: false

    - name: Enable corepack
      shell: bash
      run: corepack enable

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
        node-version-file: ${{ inputs.node-version-file }}
        cache: ${{ inputs.node-cache }}
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile
