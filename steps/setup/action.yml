name: "Setup"
description: "Checks out the repository, sets up Node and installs dependencies with pnpm."

inputs:
  repository:
    description: "The repository to checkout"
    required: false
    default: ${{ github.repository }}
  fetch-depth:
    description: "The number of commits to fetch when checking out the repository"
    required: false
    default: "1"
  token:
    description: "GitHub token used for authentication"
    required: false
    default: ${{ github.token }}
  ref:
    description: "The branch, tag or SHA to checkout."
    required: false
  registry-url:
    description: |
      URL of the registry used for Node setup. Left EMPTY by default so it does not write an .npmrc
      with a placeholder NODE_AUTH_TOKEN — that would shadow npm OIDC trusted publishing. Set it
      (e.g. https://registry.npmjs.org) only when a token-based registry is actually needed.
    required: false
    default: ""
  node-version:
    description: "The version of Node.js to use (ignored when node-version-file is set)"
    required: false
    default: "24"
  node-version-file:
    description: "Path to a file containing the Node version (e.g. .nvmrc). Takes precedence over node-version."
    required: false
    default: ""
  node-cache:
    description: "Package manager to use for caching"
    required: false
    default: "pnpm"
  install:
    description: "Whether to run pnpm install"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      with:
        repository: ${{ inputs.repository }}
        fetch-depth: ${{ inputs.fetch-depth }}
        token: ${{ inputs.token }}
        ref: ${{ inputs.ref }}

    - name: Install pnpm
      uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      with:
        run_install: false

    - name: Enable corepack
      shell: bash
      run: corepack enable

    - name: Setup Node
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
        node-version-file: ${{ inputs.node-version-file }}
        cache: ${{ inputs.node-cache }}
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile
