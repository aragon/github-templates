# Pass-through of foundry-rs/foundry-toolchain, as aragon/github-templates/steps/setup-foundry.
# Generated by `npm run passthrough:sync` — do not edit by hand. Inputs, outputs and defaults
# are copied verbatim from the upstream action.yml at the pinned SHA, so a caller swaps the
# upstream `uses:` for this action and changes nothing else. Dependabot bumps the pin; CI fails
# until the interface is re-copied (README "Pass-through actions").
name: "foundry-rs/foundry-toolchain (pass-through)"
description: "Runs foundry-rs/foundry-toolchain at the version pinned in aragon/github-templates, with the same inputs, outputs and defaults."

inputs:
  version:
    default: "stable"
    description: |
      Foundry version to install. Passed to `foundryup --install <version>`.

      This version number has to match a released version of Foundry.
      The default value is `stable`, which will pull the latest stable build.
      Other options include `nightly` or a specific version like `v1.3.6`.
    required: false
  network:
    default: "ethereum"
    description: |
      **Deprecated.** Tempo is now part of main Foundry; this input will be removed in a future release.

      Network to install Foundry for. Passed to `foundryup --network <network>`.
    required: false
  cache:
    default: "true"
    description: |
      Whether to cache Foundry data or not.

      Caching is activated by default.
    required: false
  cache-key:
    default: "${{ github.job }}-${{ github.sha }}"
    description: |
      A custom cache key to use.

      This key is used to identify the cache. If not provided, a default key consisting of the job id and the commit hash is used.
    required: false
  cache-restore-keys:
    default: |-
      ${{ github.job }}-
    description: |
      Custom cache restore keys to use.

      This key is used to identify the cache to restore. If not provided, a default key consisting of the job id is used.
    required: false

runs:
  using: "composite"
  steps:
    - id: upstream
      uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      with:
        version: ${{ inputs.version }}
        network: ${{ inputs.network }}
        cache: ${{ inputs.cache }}
        cache-key: ${{ inputs.cache-key }}
        cache-restore-keys: ${{ inputs.cache-restore-keys }}
