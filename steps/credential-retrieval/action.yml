# The ONLY place in this repo that talks to 1Password: one action owns the CLI install, the `op`
# invocations, output masking and `op://` reference validation.
#
# Pick a mode:
#   - byref:     resolve a short list of NAMED secrets, each from its own `op://vault/item/field`
#                reference (a GitHub PAT, a Slack token, an SSH key, ...). Outputs one JSON blob
#                (see `outputs.secrets`), so values never reach $GITHUB_ENV or the environment of
#                later steps — only a step that reads a field via fromJSON() sees it.
#   - alltoenv:  bulk-load every "API Credential" item in one vault as MASKED env vars (var name =
#                item title). Broad, job-wide exposure by design — only for genuinely bulk secret
#                needs (e.g. materialising a full app .env).
#   - alltofile: same bulk load as alltoenv, appended to a file instead of $GITHUB_ENV.
name: "Credential Retrieval"
description: "Single entry point for every 1Password interaction: bulk vault -> env/file, or named op:// references -> a JSON output."

inputs:
  # NOTE: composite-action inputs support no `type:`/`options:` metadata (that is
  # workflow_dispatch syntax) — allowed values are documented here and validated in the steps.
  mode:
    description: |
      One of: alltoenv | alltofile | byref.
      - byref:     resolve named `op://` references passed in `secret-refs` (see that input for the
        format).
      - alltoenv:  load every item in `op-vault` and set them as MASKED GitHub env vars.
      - alltofile: load every item in `op-vault` and append them to `secret-filepath`.
    required: false
    default: "alltoenv"

  secret-filepath:
    description: |
      'alltofile' only. Filepath where secrets will be downloaded. Secrets are appended to the end
      of the file.
    required: false
    default: ".env"

  file-format:
    description: |
      'alltofile' only. Format of the output file. Only 'env' is supported (VARNAME=VARVALUE).
    required: false
    default: "env"

  # OP values
  op-token:
    description: "1Password service account token. Always required — every mode authenticates the CLI with it."
    required: true

  op-vault:
    description: "1Password vault to bulk-load from. Required for 'alltoenv' / 'alltofile'; unused by 'byref' (each entry in secret-refs carries its own vault)."
    required: false
    default: ""

  secret-refs:
    description: |
      'byref' only. Newline-separated `NAME=op://vault/item/field` pairs, one per secret, e.g.:

        secret-refs: |
          RELEASE_TOKEN=op://kv_app_infra/ARABOT_PAT/credential
          SLACK_BOT_TOKEN={{ inputs.op-slack-bot-token-path }}

      (Write the second example with a leading dollar sign — the runner template-evaluates this
      manifest when loading the action, prose included, so the literal expression syntax cannot
      appear anywhere in this file's descriptions.)

      NAME must match [A-Za-z_][A-Za-z0-9_]*. A line whose ref side is empty (e.g. `SLACK_BOT_TOKEN=`)
      is treated as "optional secret not configured" and resolves to an empty string instead of
      failing — this lets callers wire through optional op-*-path inputs unconditionally. A line
      with no '=' at all is a malformed entry and fails the step (this is NOT the same as an empty
      ref — it usually means a caller forgot to append `={{ inputs.op-foo-path }}`, dollar sign
      included).
    required: false
    default: ""

outputs:
  secrets:
    description: |
      'byref' only. JSON object mapping each NAME from `secret-refs` to its resolved value; always
      valid JSON — '{}' for any other mode (or when secret-refs is empty), so fromJSON() is always
      safe to call unconditionally. Read a field with fromJSON(), adding the leading dollar sign
      (omitted here — see secret-refs above):
        {{ fromJSON(steps.<id>.outputs.secrets).RELEASE_TOKEN }}
    value: ${{ steps.byref.outputs.secrets || '{}' }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      env:
        MODE: ${{ inputs.mode }}
        OP_VAULT: ${{ inputs.op-vault }}
      shell: bash
      run: |
        set -euo pipefail
        case "$MODE" in
          alltoenv|alltofile|byref) ;;
          *)
            echo "::error::Unknown mode '$MODE' (expected alltoenv, alltofile, or byref)" >&2
            exit 1
            ;;
        esac
        if [[ "$MODE" == "alltoenv" || "$MODE" == "alltofile" ]] && [[ -z "$OP_VAULT" ]]; then
          echo "::error::op-vault is required for mode '$MODE'" >&2
          exit 1
        fi

    - name: Install 1Password CLI
      uses: 1password/install-cli-action@a5215d3a7f75c1629216c465ea9ab3ab399c4b71 # v4.0.0

    - name: List all items in the vault
      if: ${{ inputs.mode == 'alltoenv' || inputs.mode == 'alltofile' }}
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-token }}
        OP_VAULT: ${{ inputs.op-vault }}
      shell: bash
      run: |
        set -euo pipefail
        echo "Retrieving a list of all credential names in the vault $OP_VAULT"
        op item list --vault "$OP_VAULT" --categories 'API Credential' --format json > op_list.json

    - name: "Download all vault secrets and set them as env vars"
      if: ${{ inputs.mode == 'alltoenv' }}
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-token }}
        OP_VAULT: ${{ inputs.op-vault }}
      shell: bash
      run: |
        set -euo pipefail
        . "$GITHUB_ACTION_PATH/../../lib/gha.sh"
        number_entries=0
        if [[ -f op_list.json ]]; then
          number_entries=$(jq length op_list.json)
        fi
        for ((i = 0; i < number_entries; i++)); do
          item_name=$(jq -r ".[$i].title" op_list.json)
          # Item titles become env-var names. Skip anything that isn't a valid identifier instead
          # of writing a malformed (or, if a title ever contained embedded newlines, spoofed) entry
          # to $GITHUB_ENV. Newlines are escaped (not left raw) before logging the warning, so a
          # title crafted to smuggle a second `::workflow-command::` line can't do so here either.
          if ! [[ "$item_name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            safe_name="${item_name//$'\n'/\\n}"
            echo "::warning::Skipping vault item '${safe_name}' — not a valid env var name"
            continue
          fi
          item_credential=$(op read "op://${OP_VAULT}/${item_name}/credential")
          gha_mask "$item_credential"
          gha_set_multiline "$GITHUB_ENV" "$item_name" "$item_credential"
        done
        rm -f op_list.json

    - name: "Download all vault secrets and store them in a file"
      if: ${{ inputs.mode == 'alltofile' }}
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-token }}
        OP_VAULT: ${{ inputs.op-vault }}
        FILE_FORMAT: ${{ inputs.file-format }}
        SECRET_FILEPATH: ${{ inputs.secret-filepath }}
      shell: bash
      run: |
        set -euo pipefail
        . "$GITHUB_ACTION_PATH/../../lib/gha.sh"
        number_entries=0
        if [[ -f op_list.json ]]; then
          number_entries=$(jq length op_list.json)
        fi
        for ((i = 0; i < number_entries; i++)); do
          item_name=$(jq -r ".[$i].title" op_list.json)
          if ! [[ "$item_name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            safe_name="${item_name//$'\n'/\\n}"
            echo "::warning::Skipping vault item '${safe_name}' — not a valid env var name"
            continue
          fi
          item_credential=$(op read "op://${OP_VAULT}/${item_name}/credential")
          gha_mask "$item_credential"
          case "$FILE_FORMAT" in
            env)
              # The flat VARNAME=VARVALUE format has no standard escaping for embedded newlines —
              # rather than silently writing a line that corrupts the next entry when this file is
              # later parsed, skip it (same policy as an invalid item name).
              if [[ "$item_credential" == *$'\n'* ]]; then
                echo "::warning::Skipping vault item '${item_name}' — credential contains embedded newlines, unsafe for the flat env file format"
                continue
              fi
              echo "${item_name}=${item_credential}" >> "$SECRET_FILEPATH"
              ;;
            *)
              echo "::error::Unsupported file-format: $FILE_FORMAT" >&2
              exit 1
              ;;
          esac
        done
        rm -f op_list.json

    - name: "Resolve named 1Password references"
      id: byref
      if: ${{ inputs.mode == 'byref' }}
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-token }}
        SECRET_REFS: ${{ inputs.secret-refs }}
      shell: bash
      run: |
        set -euo pipefail
        . "$GITHUB_ACTION_PATH/../../lib/gha.sh"
        # The op:// reference shape, validated only here.
        NAME_RE='^[A-Za-z_][A-Za-z0-9_]*$'
        REF_RE='^op://[A-Za-z0-9 ._-]+/[A-Za-z0-9 ._-]+/[A-Za-z0-9 ._-]+$'
        json='{}'
        while IFS= read -r line; do
          line="${line%$'\r'}"
          [[ -z "${line// /}" ]] && continue
          if [[ "$line" != *"="* ]]; then
            echo "::error::Malformed secret-refs entry (expected NAME=op://... or NAME=): '$line'" >&2
            exit 1
          fi
          name="${line%%=*}"
          ref="${line#*=}"
          if ! [[ "$name" =~ $NAME_RE ]]; then
            echo "::error::Invalid secret name '$name' in secret-refs (must match [A-Za-z_][A-Za-z0-9_]*)" >&2
            exit 1
          fi
          if [[ -z "$ref" ]]; then
            # Optional secret left unset by the caller — resolve to empty, not an error.
            json=$(jq -c --arg k "$name" --arg v "" '. + {($k): $v}' <<< "$json")
            continue
          fi
          if ! [[ "$ref" =~ $REF_RE ]]; then
            echo "::error::secret-refs: '$name' is not a valid op:// reference" >&2
            exit 1
          fi
          value="$(op read "$ref")"
          gha_mask "$value"
          json=$(jq -c --arg k "$name" --arg v "$value" '. + {($k): $v}' <<< "$json")
        done <<< "$SECRET_REFS"

        gha_set_multiline "$GITHUB_OUTPUT" secrets "$json"
