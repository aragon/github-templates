name: Extract Slack TS
description: "Extracts the <!-- slack_ts: ... --> marker from a text body (e.g. a PR description)."

inputs:
  body:
    description: Body text to parse
    required: true

outputs:
  ts:
    description: Extracted Slack thread ts (empty if missing)
    value: ${{ steps.extract.outputs.ts }}

runs:
  using: composite
  steps:
    - id: extract
      shell: bash
      env:
        BODY: ${{ inputs.body }}
      run: |
        set -euo pipefail
        TS="$(node -p 'require(process.argv[1]).extractSlackTs(process.env.BODY)' "$GITHUB_ACTION_PATH/../../lib/markers.js")"
        echo "ts=$TS" >> "$GITHUB_OUTPUT"
