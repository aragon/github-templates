# Pass-through of oven-sh/setup-bun, as aragon/github-templates/steps/setup-bun.
# Generated by `npm run passthrough:sync` — do not edit by hand. Inputs, outputs and defaults
# are copied verbatim from the upstream action.yml at the pinned SHA, so a caller swaps the
# upstream `uses:` for this action and changes nothing else. Dependabot bumps the pin; CI fails
# until the interface is re-copied (README "Pass-through actions").
# Not exposed (deprecated upstream; passing them would warn on every run): registry-url, scope.
name: "oven-sh/setup-bun (pass-through)"
description: "Runs oven-sh/setup-bun at the version pinned in aragon/github-templates, with the same inputs, outputs and defaults."

inputs:
  bun-version:
    description: The version of Bun to install. (e.g. "latest", "canary", "1.0.0", "1.0.x", <sha>)
    required: false
  bun-version-file:
    description: The version of Bun to install from file. (e.g. "package.json", ".bun-version", ".tool-versions")
    default: null
    required: false
  bun-download-url:
    description: Override the URL to download Bun from. This skips version resolution and verifying AVX2 support.
    required: false
  registries:
    description: |
      List of package registries with authentication support. Format:
      - Default registry: https://registry.npmjs.org/
      - Default with token: https://registry.npmjs.org/|token
      - Scoped registry: @scope:https://registry.example.com/
      - Scoped with token: @scope:https://registry.example.com/|token
      - Scoped with credentials: @scope:https://user:pass@registry.example.com/
    required: false
  no-cache:
    required: false
    type: boolean
    default: false
    description: Disable caching of bun executable.
  token:
    required: false
    default: ${{ github.server_url == 'https://github.com' && github.token || '' }}
    description: Personal access token (PAT) used to fetch tags from oven-sh/bun repository. Recommended for resolving wildcard/range versions to avoid GitHub API rate limiting. When running this action on github.com, the default value is sufficient. When running on GHES, you can pass a personal access token for github.com if you are experiencing rate limiting.

outputs:
  bun-version:
    description: The version of Bun that was installed.
    value: ${{ steps.upstream.outputs.bun-version }}
  bun-revision:
    description: The revision of Bun that was installed.
    value: ${{ steps.upstream.outputs.bun-revision }}
  bun-path:
    description: The path to the Bun executable.
    value: ${{ steps.upstream.outputs.bun-path }}
  bun-download-url:
    description: The URL from which Bun was downloaded.
    value: ${{ steps.upstream.outputs.bun-download-url }}
  cache-hit:
    description: If the version of Bun was cached.
    value: ${{ steps.upstream.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - id: upstream
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
        bun-version-file: ${{ inputs.bun-version-file }}
        bun-download-url: ${{ inputs.bun-download-url }}
        registries: ${{ inputs.registries }}
        no-cache: ${{ inputs.no-cache }}
        token: ${{ inputs.token }}
