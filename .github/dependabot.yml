version: 2
updates:
  # Keep the third-party actions pinned inside this repo's composite actions and reusable
  # workflows up to date. Dependabot opens bump PRs (preserving SHA pins) when new versions ship.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns:
          - "*"

# Consumer repos carry the same `github-actions` ecosystem block: they reference the moving major
# tag (`aragon/github-templates/...@v1`), which a fix moves for every repo at once, and Dependabot
# opens the PR that adopts the next major (`@v2`) when one ships — see README "Versioning".
