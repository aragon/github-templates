# Reusable Release — PR Refresh. Regenerates the release summary on every push to a
# release PR and rewrites the PR body with it, so the body (including the ⚠️ Open
# tickets warning from generate-release-summary) keeps reflecting the branch's actual
# contents instead of the snapshot taken at release-start. The `<!-- slack_ts: … -->`
# marker is re-appended so Slack threading survives the rewrite.
#
# Call from the consumer's pull_request workflow (opened/synchronize/reopened); the
# refresh job green-skips for head branches outside `release-branch-prefix`.
#
# Degrades gracefully — every integration is optional:
#   - no Linear token → summary has no enrichment and no open-tickets section;
#   - no Slack in the repo → there is no slack_ts marker to carry, nothing is appended;
#   - Slack itself is never called here.
# The PR body is owned by this automation: manual edits to it are overwritten on the
# next push (matching release-start, which authored it in the first place).
#
# History mode only (generate-release-summary). release-start's 'packages' summary mode
# cannot be refreshed: generate-version-summary detects bumped packages via dirty
# package.json files, which only exist before the release commit — after it, a refresh
# would always yield "No packages bumped." and stomp the body.
#
# SELF-REFERENCE NOTE: `aragon/github-templates/steps/*@main` — see e2e.yml header.

name: Release — PR Refresh

on:
  workflow_call:
    inputs:
      release-branch-prefix:
        description: "Head-branch prefix identifying release PRs (monorepo lineages: 'release/app/')"
        required: false
        type: string
        default: "release/"
      tag-prefix:
        description: "Release tag prefix bounding the summary range (monorepo: '@aragon/app@')"
        required: false
        type: string
        default: "v"
      summary-path-filter:
        description: "history mode: named filter in the filters file restricting the summary to one workspace's paths"
        required: false
        type: string
        default: ""
      summary-filters-file:
        description: "Consumer-repo path to the workspace→paths mapper (used with 'summary-path-filter')"
        required: false
        type: string
        default: ".github/filters.yml"
      op-release-token-path:
        description: "1Password path to a GitHub PAT used to edit the PR body"
        required: true
        type: string
      op-linear-token-path:
        description: "1Password path to a Linear API token to enrich the summary (optional)"
        required: false
        type: string
        default: ""
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: "1Password service account token scoped to the caller repo's vault"
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-pr-refresh-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: startsWith(github.head_ref, inputs.release-branch-prefix)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve 1Password secrets
        id: op
        uses: aragon/github-templates/steps/credential-retrieval@main
        with:
          mode: byref
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          secret-refs: |
            RELEASE_TOKEN=${{ inputs.op-release-token-path }}
            LINEAR_API_TOKEN=${{ inputs.op-linear-token-path }}

      # Full history: the summary range starts at the latest release tag.
      - name: Setup
        uses: aragon/github-templates/steps/setup@main
        with:
          token: ${{ fromJSON(steps.op.outputs.secrets).RELEASE_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: "0"
          install: "false"

      - name: Generate release summary
        id: summary
        uses: aragon/github-templates/steps/generate-release-summary@main
        with:
          linear-api-token: ${{ fromJSON(steps.op.outputs.secrets).LINEAR_API_TOKEN }}
          tag-glob: ${{ inputs.tag-prefix }}[0-9]*
          path-filter: ${{ inputs.summary-path-filter }}
          filters-file: ${{ inputs.summary-filters-file }}

      - name: Read PR body
        id: pr-body
        uses: aragon/github-templates/steps/gh-pr-get-body@main
        with:
          pr-number: ${{ github.event.pull_request.number }}
          token: ${{ fromJSON(steps.op.outputs.secrets).RELEASE_TOKEN }}

      # The marker was appended by release-start; carry it over so Slack threading of
      # downstream flows (finalize, cancel) survives the body rewrite.
      - name: Extract Slack thread marker
        id: slack-ts
        uses: aragon/github-templates/steps/extract-slack-ts@main
        with:
          body: ${{ steps.pr-body.outputs.body }}

      - name: Update PR body
        uses: aragon/github-templates/steps/gh-pr-edit-body@main
        with:
          pr-number: ${{ github.event.pull_request.number }}
          token: ${{ fromJSON(steps.op.outputs.secrets).RELEASE_TOKEN }}
          body: |
            ${{ steps.summary.outputs.summary }}

            ${{ steps.slack-ts.outputs.ts && format('<!-- slack_ts: {0} -->', steps.slack-ts.outputs.ts) || '' }}
