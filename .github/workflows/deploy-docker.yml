# Reusable build-on-server Docker deploy over SSH. Generic transport + environment gate; the repo
# supplies its own remote deploy command (e.g. scripts/app-deploy.sh) because that orchestration is
# service-specific. SSH credentials are resolved from 1Password paths only inside this workflow.
#
# `prepare-command` runs in the checkout before the sync, with the 1Password CLI installed and
# OP_SERVICE_ACCOUNT_TOKEN in its environment: the place for a repo to materialize its own config
# files (several env files from one vault item, a docker config) so they travel to the server with
# the code. `op-env-vault` covers the common one-vault-to-one-file case without a script.
#
# Slack ceremony (notify.yml), on when the op-slack-* paths are set: "started", "waiting for
# approval" when `gated` (posted beside the deploy job, never ahead of it), and the result; the
# messages thread under the release conversation found through `slack-thread-*`, or open a new
# thread whose ts is returned as `slack-ts`.
#
# SELF-REFERENCE NOTE: `aragon/github-templates/steps/*@main` — see e2e.yml header.

name: Deploy (Docker over SSH)

on:
  workflow_call:
    inputs:
      env:
        description: "Target environment (drives the GitHub environment gate)"
        required: true
        type: string
      ref:
        description: "Branch, tag or SHA to deploy"
        required: false
        type: string
      allow-unsafe-pr-checkout:
        description: |
          Pass-through to actions/checkout's `allow-unsafe-pr-checkout`. Only set this to true if
          THIS workflow is called from a `pull_request_target` / `workflow_run` trigger that
          intentionally deploys fork PR code via `ref`, and the risk at
          https://gh.io/securely-using-pull_request_target has been reviewed. Defaults to false.
        required: false
        type: boolean
        default: false
      remote-path:
        description: "Directory on the server to sync the repo into"
        required: false
        type: string
        default: "~/app"
      prepare-command:
        description: "Command run in the checkout before the sync, with the `op` CLI and OP_SERVICE_ACCOUNT_TOKEN available (optional)"
        required: false
        type: string
        default: ""
      deploy-command:
        description: "Command executed on the server, inside remote-path, after sync"
        required: true
        type: string
      op-ssh-key-path:
        description: "1Password path to the SSH private key"
        required: true
        type: string
      op-ssh-user-path:
        description: "1Password path to the SSH user"
        required: true
        type: string
      op-ssh-host-path:
        description: "1Password path to the SSH host"
        required: true
        type: string
      op-env-vault:
        description: "1Password vault bulk-loaded into 'env-file-path' before the sync, so the server receives a fresh env file (optional)"
        required: false
        type: string
        default: ""
      env-file-path:
        description: "Checkout-relative file the 'op-env-vault' secrets are written to"
        required: false
        type: string
        default: ".env"
      version:
        description: "Version label shown in the Slack messages (optional)"
        required: false
        type: string
        default: ""
      gated:
        description: "The environment has required reviewers: post the 'waiting for approval' message with the team ping"
        required: false
        type: boolean
        default: false
      next-steps:
        description: "Extra lines in the success message telling the reader what to do next (optional)"
        required: false
        type: string
        default: ""
      slack-thread-ts:
        description: "Existing Slack thread to post the ceremony into (e.g. a release thread); empty = new top-level messages"
        required: false
        type: string
        default: ""
      slack-thread-pr-number:
        description: "PR whose body carries the slack_ts marker (0 = none)"
        required: false
        type: number
        default: 0
      slack-thread-release-tag:
        description: "GitHub Release (tag) whose body carries the slack_ts marker (optional)"
        required: false
        type: string
        default: ""
      op-release-token-path:
        description: "1Password path to a GitHub PAT for reading the PR / release body (optional)"
        required: false
        type: string
        default: ""
      op-slack-bot-token-path:
        description: "1Password path to the Slack bot token — enables the Slack ceremony (optional)"
        required: false
        type: string
        default: ""
      op-slack-channel-id-path:
        description: "1Password path to the Slack channel id (optional)"
        required: false
        type: string
        default: ""
      op-slack-codeowners-group-path:
        description: "1Password path to a Slack user-group id pinged (<!subteam^…>) in the gate message (optional)"
        required: false
        type: string
        default: ""
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: "1Password service account token scoped to the caller repo's vault"
        required: true
    outputs:
      gate-ts:
        description: "Slack ts of the gate message (empty when Slack is off or the deploy is not gated)"
        value: ${{ jobs.notify-gate.outputs.message-ts }}
      slack-ts:
        description: "The Slack thread the ceremony posted into (empty when Slack is off)"
        value: ${{ jobs.notify-start.outputs.ts }}

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  notify-start:
    if: inputs.op-slack-bot-token-path != ''
    uses: aragon/github-templates/.github/workflows/notify.yml@main
    with:
      kind: start
      env: ${{ inputs.env }}
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref || github.ref_name }}
      thread-ts: ${{ inputs.slack-thread-ts }}
      thread-pr-number: ${{ inputs.slack-thread-pr-number }}
      thread-release-tag: ${{ inputs.slack-thread-release-tag }}
      op-release-token-path: ${{ inputs.op-release-token-path }}
      op-slack-bot-token-path: ${{ inputs.op-slack-bot-token-path }}
      op-slack-channel-id-path: ${{ inputs.op-slack-channel-id-path }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  # Sibling of `deploy`, never in its `needs`: the gate message can never hold the deploy.
  notify-gate:
    needs: notify-start
    if: ${{ inputs.op-slack-bot-token-path != '' && inputs.gated }}
    uses: aragon/github-templates/.github/workflows/notify.yml@main
    with:
      kind: gate
      env: ${{ inputs.env }}
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref || github.ref_name }}
      thread-ts: ${{ needs.notify-start.outputs.ts }}
      op-slack-bot-token-path: ${{ inputs.op-slack-bot-token-path }}
      op-slack-channel-id-path: ${{ inputs.op-slack-channel-id-path }}
      op-slack-codeowners-group-path: ${{ inputs.op-slack-codeowners-group-path }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      # The only 1Password reference resolution in this job — see steps/credential-retrieval. It
      # also installs the `op` CLI, which prepare-command may use with the same token.
      - name: Resolve SSH credentials
        id: op
        uses: aragon/github-templates/steps/credential-retrieval@main
        with:
          mode: byref
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          secret-refs: |
            SSH_KEY=${{ inputs.op-ssh-key-path }}
            SSH_USER=${{ inputs.op-ssh-user-path }}
            SSH_HOST=${{ inputs.op-ssh-host-path }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          allow-unsafe-pr-checkout: ${{ inputs.allow-unsafe-pr-checkout }}

      - name: Prepare the checkout
        if: inputs.prepare-command != ''
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DEPLOY_ENV: ${{ inputs.env }}
          PREPARE_COMMAND: ${{ inputs.prepare-command }}
        run: bash -euo pipefail -c "$PREPARE_COMMAND"

      # Written before the rsync so the file travels to the server with the code.
      - name: Materialize env file from vault
        if: inputs.op-env-vault != ''
        uses: aragon/github-templates/steps/credential-retrieval@main
        with:
          mode: alltofile
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          op-vault: ${{ inputs.op-env-vault }}
          secret-filepath: ${{ inputs.env-file-path }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ fromJSON(steps.op.outputs.secrets).SSH_KEY }}
          SSH_HOST: ${{ fromJSON(steps.op.outputs.secrets).SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync repo to server
        env:
          SSH_USER: ${{ fromJSON(steps.op.outputs.secrets).SSH_USER }}
          SSH_HOST: ${{ fromJSON(steps.op.outputs.secrets).SSH_HOST }}
          REMOTE_PATH: ${{ inputs.remote-path }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" "mkdir -p ${REMOTE_PATH}"
          rsync -az --delete --exclude '.git' -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/"

      - name: Run remote deploy command
        env:
          SSH_USER: ${{ fromJSON(steps.op.outputs.secrets).SSH_USER }}
          SSH_HOST: ${{ fromJSON(steps.op.outputs.secrets).SSH_HOST }}
          REMOTE_PATH: ${{ inputs.remote-path }}
          DEPLOY_COMMAND: ${{ inputs.deploy-command }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "cd ${REMOTE_PATH} && ${DEPLOY_COMMAND}"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  notify-result:
    needs: [notify-start, deploy]
    if: ${{ always() && inputs.op-slack-bot-token-path != '' }}
    uses: aragon/github-templates/.github/workflows/notify.yml@main
    with:
      kind: result
      env: ${{ inputs.env }}
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref || github.ref_name }}
      result: ${{ needs.deploy.result }}
      next-steps: ${{ inputs.next-steps }}
      thread-ts: ${{ needs.notify-start.outputs.ts }}
      op-slack-bot-token-path: ${{ inputs.op-slack-bot-token-path }}
      op-slack-channel-id-path: ${{ inputs.op-slack-channel-id-path }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
