# github-templates releases itself: cut an immutable semver tag (vX.Y.Z) and move the floating
# major tag (vX) to it. The consumers reference the major tag, so moving it is what ships a change
# to every repo; a major tag never moves backwards (the new cut must descend from where it is).
#
# This is a normal in-repo workflow (not workflow_call), so it can dogfood the repo's own
# composite action via a relative path after checkout.

name: Release — Self

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to cut, with leading v (e.g. v0.5.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version
        id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v0.5.0" >&2
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure semver tag (dogfoods steps/gh-ensure-tag)
        uses: ./steps/gh-ensure-tag
        with:
          tag: ${{ steps.v.outputs.tag }}
          sha: ${{ github.sha }}

      - name: Move floating major tag
        env:
          MAJOR: ${{ steps.v.outputs.major }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$MAJOR" >/dev/null \
            && ! git merge-base --is-ancestor "$MAJOR" "$SHA"; then
            echo "::error::$MAJOR points to $(git rev-list -n 1 "$MAJOR"), which is not an ancestor of $SHA — a major tag never moves backwards" >&2
            exit 1
          fi
          git tag -f "$MAJOR" "$SHA"
          git push -f origin "$MAJOR"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --generate-notes
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
