# github-templates releases itself: cut an immutable semver tag (vX.Y.Z) and move the floating
# major tag (vX) to it. Consumers pin to a SHA + Dependabot; the major tag gives a human-readable
# line and lets early adopters track vX.
#
# This is a normal in-repo workflow (not workflow_call), so it can dogfood the repo's own
# composite action via a relative path after checkout.

name: Release — Self

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to cut, with leading v (e.g. v0.5.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Validate version
        id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v0.5.0" >&2
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure semver tag (dogfoods steps/gh-ensure-tag)
        uses: ./steps/gh-ensure-tag
        with:
          tag: ${{ steps.v.outputs.tag }}
          sha: ${{ github.sha }}

      - name: Move floating major tag
        env:
          MAJOR: ${{ steps.v.outputs.major }}
        run: |
          set -euo pipefail
          git tag -f "$MAJOR" "${{ github.sha }}"
          git push -f origin "$MAJOR"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --generate-notes
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
