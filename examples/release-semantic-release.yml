# Example: semantic-release release (scenario C backend). Same orchestration as the changesets
# example — only `engine` changes. Repo-specific policies plug in via optional inputs: the
# stale-lineage guard is `require-version-above-latest-tag`, caller-computed blocks (e.g. a
# DB-migration warning, produced by a preceding job) ride `body-extras` into the PR body and the
# Slack message. The staging deploy on the release PR goes through deploy-docker.yml behind the
# staging environment's required reviewers (`gated: true`); the production deploy hangs off the
# GitHub Release the same way (see deploy-production.yml for the Vercel twin).
#
# Linear-history repos (back-merge model) run the scheduled start on their default branch
# (`development`) and keep their back-merge / hotfix cherry-pick flows in the consumer.

name: Release (semantic-release)

on:
  schedule:
    - cron: "37 14 * * 1"
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  start:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: aragon/github-templates/.github/workflows/release-start.yml@main
    with:
      engine: semantic-release
      base-ref: ${{ github.ref_name }}
      require-version-above-latest-tag: true
      on-active-release: ${{ github.event_name == 'schedule' && 'skip' || 'fail' }}
      # Caller-computed markdown for the PR body + Slack message, e.g. from a preceding job:
      # body-extras: ${{ needs.detect-migrations.outputs.warning }}
      op-release-token-path: op://kv_backend2_infra/ARABOT_APP_BACKEND_RELEASES/credential
      op-gpg-key-path: op://kv_backend2_infra/arabot-1_SIGN_CERTS/private_key
      op-gpg-passphrase-path: op://kv_backend2_infra/arabot-1_SIGN_CERTS/credential
      op-slack-bot-token-path: op://kv_backend2_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_backend2_infra/SLACK_CHANNEL_ID/credential
      op-slack-codeowners-group-path: op://kv_backend2_infra/SLACK_CODEOWNERS_GROUP_ID/credential
      op-linear-token-path: op://kv_backend2_infra/LINEAR_API_TOKEN/credential
      op-linear-pipeline-key-path: op://kv_backend2_infra/LINEAR_PIPELINE_ACCESS_KEY/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}

  refresh:
    if: >
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && (startsWith(github.event.pull_request.head.ref, 'release/')
          || startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    uses: aragon/github-templates/.github/workflows/release-pr-refresh.yml@main
    with:
      op-release-token-path: op://kv_backend2_infra/ARABOT_APP_BACKEND_RELEASES/credential
      op-linear-token-path: op://kv_backend2_infra/LINEAR_API_TOKEN/credential
      op-slack-bot-token-path: op://kv_backend2_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_backend2_infra/SLACK_CHANNEL_ID/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}

  deploy-staging:
    if: >
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && (startsWith(github.event.pull_request.head.ref, 'release/')
          || startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    uses: aragon/github-templates/.github/workflows/deploy-docker.yml@main
    with:
      env: staging
      ref: ${{ github.event.pull_request.head.sha }}
      remote-path: ~/app-backend-deploy
      prepare-command: bash scripts/download-configs.sh stg
      deploy-command: bash scripts/app-deploy.sh stg
      op-ssh-key-path: op://kv_backend2_infra/backend2_server_stg/deploy_cert
      op-ssh-user-path: op://kv_backend2_infra/backend2_server_stg/username
      op-ssh-host-path: op://kv_backend2_infra/backend2_server_stg/URL
      version: ${{ github.event.pull_request.title }}
      gated: true
      slack-thread-pr-number: ${{ github.event.pull_request.number }}
      next-steps: "Ready for testing 🧪 — once it looks good, approve the PR and merge; the production deploy then waits for its approval."
      op-release-token-path: op://kv_backend2_infra/ARABOT_APP_BACKEND_RELEASES/credential
      op-slack-bot-token-path: op://kv_backend2_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_backend2_infra/SLACK_CHANNEL_ID/credential
      op-slack-codeowners-group-path: op://kv_backend2_infra/SLACK_CODEOWNERS_GROUP_ID/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}

  finalize:
    if: >
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && (startsWith(github.event.pull_request.head.ref, 'release/')
          || startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    uses: aragon/github-templates/.github/workflows/release-finalize.yml@main
    with:
      # Backend policy: tag the merge commit. main is a release line (release and hotfix merges
      # only, back-merged into development), so the merge commit is main itself.
      sha: ${{ github.event.pull_request.merge_commit_sha }}
      pr-body: ${{ github.event.pull_request.body }}
      after-release-note: "Production deploy will start automatically and wait for its approval."
      op-release-token-path: op://kv_backend2_infra/ARABOT_APP_BACKEND_RELEASES/credential
      op-slack-bot-token-path: op://kv_backend2_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_backend2_infra/SLACK_CHANNEL_ID/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}

  # Also cancels this PR's deploy run if it still sits on the staging approval (needs
  # `actions: write` above).
  cancel:
    if: >
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == false
      && (startsWith(github.event.pull_request.head.ref, 'release/')
          || startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    uses: aragon/github-templates/.github/workflows/release-pr-cancel.yml@main
    with:
      cancel-waiting-runs-of: release.yml
      op-release-token-path: op://kv_backend2_infra/ARABOT_APP_BACKEND_RELEASES/credential
      op-slack-bot-token-path: op://kv_backend2_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_backend2_infra/SLACK_CHANNEL_ID/credential
      op-slack-codeowners-group-path: op://kv_backend2_infra/SLACK_CODEOWNERS_GROUP_ID/credential
      op-linear-pipeline-key-path: op://kv_backend2_infra/LINEAR_PIPELINE_ACCESS_KEY/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_BACKEND2_INFRA }}
