# Example: Changesets release (scenario A frontend / B library).
# Three workflows shown together: Start (manual), Refresh (on release-PR push) and
# Finalize (on release-PR merge).
# Pin @main to a SHA in real use (see examples/README.md).

name: Release (changesets)

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  # Manual: cut the release branch + PR.
  start:
    if: github.event_name == 'workflow_dispatch'
    uses: aragon/github-templates/.github/workflows/release-start.yml@main
    with:
      engine: changesets
      op-release-token-path: op://kv_app_infra/ARABOT_PAT/credential
      op-gpg-key-path: op://kv_app_infra/arabot-1_SIGN_CERTS/private_key
      op-gpg-passphrase-path: op://kv_app_infra/arabot-1_SIGN_CERTS/credential
      op-slack-bot-token-path: op://kv_app_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_app_infra/SLACK_CHANNEL_ID/credential
      op-linear-token-path: op://kv_app_infra/LINEAR_API_TOKEN/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  # On every push to a release/* PR: regenerate the summary (incl. the ⚠️ open-tickets
  # warning) and rewrite the PR body. The reusable workflow green-skips other branches,
  # so the `if` here only saves the queued run.
  refresh:
    if: >
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && startsWith(github.event.pull_request.head.ref, 'release/')
    uses: aragon/github-templates/.github/workflows/release-pr-refresh.yml@main
    with:
      op-release-token-path: op://kv_app_infra/ARABOT_PAT/credential
      op-linear-token-path: op://kv_app_infra/LINEAR_API_TOKEN/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  # On merge of a release/* PR into main: tag + GitHub Release (the only tagging point).
  # `sha: head.sha` tags the staging-TESTED commit (recommended); use merge_commit_sha instead
  # when the repo squash-merges and the head commit never lands on main.
  finalize:
    if: >
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/')
    uses: aragon/github-templates/.github/workflows/release-finalize.yml@main
    with:
      sha: ${{ github.event.pull_request.head.sha }}
      pr-body: ${{ github.event.pull_request.body }}
      changesets-guard: all
      op-release-token-path: op://kv_app_infra/ARABOT_PAT/credential
      op-slack-bot-token-path: op://kv_app_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_app_infra/SLACK_CHANNEL_ID/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
